<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Stats</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  main { max-width: 1040px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .tile { background: #fffdf8; border: 1px solid #e3d9c6; border-radius: 12px; padding: 14px 16px; }
  .tile .k { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .tile .v { font-size: 30px; font-weight: bold; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .s { color: var(--muted); font-size: 13px; }
  .card { background: #fffdf8; border: 1px solid #e3d9c6; border-radius: 12px; padding: 16px; margin: 16px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid #eee5d4; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td a { color: inherit; text-decoration: none; border-bottom: 1px dotted #c8892b; }
  .best { background: #f6ead1; }
  .note { color: var(--muted); font-size: 14px; }
  .err { color: #b3261e; font-size: 14px; }
  .scroll { overflow-x: auto; }
  canvas { max-height: 280px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="logo.png" alt="Ink Idea &amp; AI logo">
    <div><h1>Ink Stats</h1><p class="tag" id="updated">Loading…</p></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <h2 style="margin-top:0">Views over time</h2>
    <canvas id="trend"></canvas>
    <p class="note" id="trendNote"></p>
  </div>

  <div class="card scroll">
    <h2 style="margin-top:0">Per cartoon</h2>
    <table id="table"></table>
    <p class="note">Views per platform; click a number to open the post. Highlighted = best cartoon on that platform.
      Instagram Reel: avg watch time in brackets.</p>
  </div>

  <p class="err" id="errors"></p>
  <footer><a href="index.html">Home</a> · Refreshed twice a day (about 9:15 and 21:15 Pacific).</footer>
</main>

<script>
const PLATFORMS = [
  ["tiktok", "TikTok"], ["instagram_reel", "IG Reel"], ["instagram_image", "IG image"], ["x", "X"], ["threads", "Threads"]];
const fmt = n => n == null ? "–" : Number(n).toLocaleString();
const bust = "?t=" + Date.now();   // GitHub Pages caches; always fetch the latest

Promise.all([fetch("stats.json" + bust).then(r => r.json()),
             fetch("stats-history.json" + bust).then(r => r.ok ? r.json() : []).catch(() => [])])
  .then(([s, hist]) => render(s, hist))
  .catch(e => document.getElementById("updated").textContent = "Couldn't load stats: " + e.message);

function render(s, hist) {
  const when = new Date(s.updated);
  document.getElementById("updated").textContent = "Updated " + when.toLocaleString([], {dateStyle: "medium", timeStyle: "short"});
  const cs = Object.entries(s.cartoons);

  // tiles: total views per platform, followers, interactions
  const tot = {}; let inter = 0;
  for (const [, c] of cs) for (const [p] of PLATFORMS) if (c[p]) {
    tot[p] = (tot[p] || 0) + (c[p].views || 0);
    inter += (c[p].likes || 0) + (c[p].comments || 0) + (c[p].shares || 0) + (c[p].saves || 0);
  }
  const all = Object.values(tot).reduce((a, b) => a + b, 0);
  const f = s.followers || {};
  const followers = ["instagram", "x", "tiktok", "threads"].map(k => f[k]).filter(v => v != null).reduce((a, b) => a + b, 0);
  const tiles = [["All views", all, `${cs.length} cartoons`], ...PLATFORMS.map(([k, l]) => [l + " views", tot[k], ""]),
                 ["Interactions", inter, "likes · comments · shares · saves"], ["Followers", followers, "Instagram + X"]];
  document.getElementById("tiles").innerHTML = tiles.map(([k, v, sub]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v">${fmt(v)}</div><div class="s">${sub}</div></div>`).join("");

  // table
  const best = {};
  for (const [p] of PLATFORMS) best[p] = Math.max(0, ...cs.map(([, c]) => (c[p] && c[p].views) || 0));
  let html = "<tr><th>Cartoon</th>" + PLATFORMS.map(([, l]) => `<th>${l}</th>`).join("") + "<th>Total</th></tr>";
  for (const [n, c] of cs) {
    let row = 0;
    html += `<tr><td>No. ${n} · ${c.title}</td>` + PLATFORMS.map(([p]) => {
      const d = c[p]; if (!d) return "<td>–</td>";
      row += d.views || 0;
      const extra = p === "instagram_reel" && d.avg_watch_s ? ` <span class="note">(${Math.min(d.avg_watch_s, 99)} s)</span>` : "";
      const cls = d.views && d.views === best[p] ? ' class="best"' : "";
      return `<td${cls}>${d.url ? `<a href="${d.url}" target="_blank">${fmt(d.views)}</a>` : fmt(d.views)}${extra}</td>`;
    }).join("") + `<td><b>${fmt(row)}</b></td></tr>`;
  }
  document.getElementById("table").innerHTML = html;

  // trend from history
  if (hist.length > 1 && window.Chart) {
    const colors = {tiktok: "#1d1b18", instagram_reel: "#c8892b", instagram_image: "#e6c27a", x: "#6b645a", threads: "#9c8a6a"};
    new Chart(document.getElementById("trend"), {type: "line",
      data: {labels: hist.map(h => new Date(h.at).toLocaleDateString([], {month: "short", day: "numeric", hour: "numeric"})),
             datasets: PLATFORMS.map(([k, l]) => ({label: l, data: hist.map(h => (h.views || {})[k] ?? null),
               borderColor: colors[k], backgroundColor: colors[k], tension: .25, pointRadius: 2}))},
      options: {plugins: {legend: {position: "bottom"}}, scales: {y: {beginAtZero: true}}}});
  } else {
    document.getElementById("trend").remove();
    document.getElementById("trendNote").textContent = "The trend appears after the second refresh.";
  }
  const errs = Object.entries(s.errors || {});
  if (errs.length) document.getElementById("errors").textContent = "Couldn't refresh: " + errs.map(([k, v]) => `${k} (${v})`).join("; ");
}
</script>
</body>
</html>
