<script>
(() => {   // swipe left = older, swipe right = newer; arrow keys on desktop
  const go = side => { const a = document.querySelector(".arrow." + side); if (a) location.href = a.href; };
  let x0 = null, y0 = 0;
  const st = document.querySelector(".stage");
  st.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  st.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) go(dx < 0 ? "right" : "left");
  }, {passive: true});
  addEventListener("keydown", e => { if (e.key === "ArrowLeft") go("left"); if (e.key === "ArrowRight") go("right"); });
})();
</script>
<script>
(() => {   // Share: the phone's own share sheet when there is one, else the menu
  const phone = matchMedia("(pointer: coarse)").matches;
  document.querySelectorAll(".share").forEach(box => {
    const btn = box.querySelector(".share-btn"), menu = box.querySelector(".share-menu"), d = box.dataset;
    const open = on => { menu.hidden = !on; btn.setAttribute("aria-expanded", on); };
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      if (phone && navigator.share) {
        try { await navigator.share({title: d.title, text: d.text, url: d.url}); return; }
        catch (err) { if (err.name === "AbortError") return; }
      }
      open(menu.hidden);
    });
    const copy = box.querySelector(".copy");
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(d.url); copy.classList.add("done"); copy.title = "Link copied"; }
      catch { prompt("Copy this link:", d.url); }
      setTimeout(() => { copy.classList.remove("done"); copy.title = "Copy link"; open(false); }, 1400);
    });
    document.addEventListener("click", e => { if (!box.contains(e.target)) open(false); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") open(false); });
  });
})();
</script>
